<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIP-01 Search</title>
<meta name="description" content="SIP-01 Search — a decentralized search engine querying the Nostr kind 39697 Web Index Observation protocol directly from your browser.">
<meta property="og:title" content="SIP-01 Search">
<meta property="og:description" content="One shared decentralized index. Many independent indexers. No single owner. Powered by Nostr.">
<meta property="og:image" content="/logo-256.png">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
<style>
:root {
  --bg: #0b0d10; --panel: #14171c; --border: #23272e; --text: #e7e9ec;
  --muted: #8b93a1; --accent: #f0b90b; --accent-dim: #7a5d0a; --link: #6cb4ff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e3e5e8; --text: #14171c;
    --muted: #5c6470; --accent: #b8860b; --accent-dim: #f0dca0; --link: #1a66c9;
  }
}
:root[data-theme="light"] {
  --bg: #f7f7f8; --panel: #ffffff; --border: #e3e5e8; --text: #14171c;
  --muted: #5c6470; --accent: #b8860b; --accent-dim: #f0dca0; --link: #1a66c9;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100%;
}
header {
  padding: 28px 16px 18px; text-align: center; border-bottom: 1px solid var(--border);
}
.logo { width: 56px; height: 56px; display: block; margin: 0 auto 10px; }
h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.tag { color: var(--muted); font-size: 13px; }
.searchbar {
  max-width: 640px; margin: 18px auto 0; display: flex; gap: 8px; padding: 0 16px;
}
input[type="text"] {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px;
}
input[type="text"]:focus { outline: 2px solid var(--accent-dim); }
button {
  padding: 12px 18px; border-radius: 10px; border: none; background: var(--accent);
  color: #14171c; font-weight: 600; cursor: pointer; font-size: 14px;
}
button:disabled { opacity: 0.5; cursor: default; }
main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
.status { color: var(--muted); font-size: 13px; margin-bottom: 14px; min-height: 18px; }
.result {
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.result-url { color: var(--muted); font-size: 12px; word-break: break-all; }
.result-title { font-size: 16px; margin: 3px 0 4px; }
.result-title a { color: var(--link); text-decoration: none; }
.result-title a:hover { text-decoration: underline; }
.result-desc { color: var(--text); font-size: 13.5px; opacity: 0.9; }
.badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.badge {
  font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--muted);
}
.badge.agree { border-color: var(--accent-dim); color: var(--accent); }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
footer { text-align: center; color: var(--muted); font-size: 11px; padding: 20px; }
a.foot { color: var(--muted); }
</style>
</head>
<body>
<header>
  <img class="logo" src="/logo-256.png" alt="SIP-01 logo">
  <h1>SIP<span>-01</span> Search</h1>
  <div class="tag">One shared decentralized index · queries Nostr kind 39697 directly from your browser</div>
  <div class="searchbar">
    <input id="q" type="text" placeholder="Search the index…" autocomplete="off">
    <button id="go">Search</button>
  </div>
</header>
<main>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>
<footer>
  No central server — this page connects straight to public relays. Protocol:
  <a class="foot" href="https://github.com/SIP-01/SIP-01" target="_blank" rel="noopener">SIP-01/SIP-01</a>
</footer>
<script>
const RELAYS = [
  "wss://relay-na1.metanomalist.com",
  "wss://relay.damus.io",
  "wss://nos.lol"
];
const KIND = 39697;
const $status = document.getElementById('status');
const $results = document.getElementById('results');
const $q = document.getElementById('q');
const $go = document.getElementById('go');

let docs = new Map(); // d-tag -> { title, description, url, lang, source, indexers:Set, latest }
let sockets = [];
let searchToken = 0;

function tagVal(tags, key) {
  const t = tags.find(t => t[0] === key);
  return t ? t[1] : undefined;
}

function handleEvent(ev) {
  let d = tagVal(ev.tags, 'd');
  const u = tagVal(ev.tags, 'u');
  if (!d || !u) return;
  let parsed = {};
  try { parsed = JSON.parse(ev.content || '{}'); } catch (e) { return; }
  const entry = docs.get(d) || {
    title: parsed.title || u, description: parsed.description || '',
    url: u, source: tagVal(ev.tags, 'source') || '?', indexers: new Set(), latest: 0
  };
  entry.indexers.add(ev.pubkey);
  if (ev.created_at > entry.latest) {
    entry.latest = ev.created_at;
    if (parsed.title) entry.title = parsed.title;
    if (parsed.description) entry.description = parsed.description;
  }
  docs.set(d, entry);
}

function render() {
  const items = [...docs.values()].sort((a, b) =>
    b.indexers.size - a.indexers.size || b.latest - a.latest
  );
  if (items.length === 0) {
    $results.innerHTML = '<div class="empty">No results yet — try a broader term, or give relays a moment.</div>';
    return;
  }
  $results.innerHTML = items.map(it => `
    <div class="result">
      <div class="result-url">${escapeHtml(it.url)}</div>
      <div class="result-title"><a href="${escapeAttr(it.url)}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a></div>
      ${it.description ? `<div class="result-desc">${escapeHtml(it.description)}</div>` : ''}
      <div class="badges">
        <span class="badge agree">${it.indexers.size} indexer${it.indexers.size === 1 ? '' : 's'} agree</span>
        <span class="badge">${escapeHtml(it.source)}</span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

function closeAll() {
  sockets.forEach(ws => { try { ws.close(); } catch (e) {} });
  sockets = [];
}

function runSearch(query) {
  const token = ++searchToken;
  closeAll();
  docs = new Map();
  render();
  $status.textContent = `Connecting to ${RELAYS.length} relays…`;
  $go.disabled = true;

  let openCount = 0, eoseCount = 0;
  const subId = 'sip01-' + Math.random().toString(36).slice(2, 9);

  RELAYS.forEach(url => {
    let ws;
    try { ws = new WebSocket(url); } catch (e) { return; }
    sockets.push(ws);
    ws.onopen = () => {
      if (token !== searchToken) return;
      openCount++;
      const filter = query
        ? { kinds: [KIND], search: query, limit: 40 }
        : { kinds: [KIND], limit: 40 };
      ws.send(JSON.stringify(["REQ", subId, filter]));
    };
    ws.onmessage = (msg) => {
      if (token !== searchToken) return;
      let data;
      try { data = JSON.parse(msg.data); } catch (e) { return; }
      if (data[0] === "EVENT" && data[1] === subId) {
        handleEvent(data[2]);
        render();
      } else if (data[0] === "EOSE" && data[1] === subId) {
        eoseCount++;
        try { ws.close(); } catch (e) {}
        updateStatus(token, eoseCount);
      }
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
    ws.onclose = () => {
      if (token !== searchToken) return;
      eoseCount = Math.min(eoseCount + 1, RELAYS.length);
      updateStatus(token, eoseCount);
    };
  });
}

function updateStatus(token, eoseCount) {
  if (token !== searchToken) return;
  if (eoseCount >= RELAYS.length) {
    $status.textContent = docs.size
      ? `${docs.size} document${docs.size === 1 ? '' : 's'} from ${RELAYS.length} relays.`
      : `No matches from ${RELAYS.length} relays.`;
    $go.disabled = false;
  } else {
    $status.textContent = `Waiting on ${RELAYS.length - eoseCount} relay(s)…`;
  }
}

$go.addEventListener('click', () => runSearch($q.value.trim()));
$q.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch($q.value.trim()); });

// Show the freshest items in the index on load.
runSearch('');
</script>
</body>
</html>
